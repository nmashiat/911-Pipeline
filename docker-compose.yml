services:
  db:
    image: postgres:16
    container_name: sf911-postgres
    environment:
      POSTGRES_USER: sf911
      POSTGRES_PASSWORD: sf911
      POSTGRES_DB: sf911
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf911"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
